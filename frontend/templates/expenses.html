{% extends "base.html" %}
{% block title %}Expenses · Expense Tracker{% endblock %}
{% block content %}
<div class="page-head"><h1>Expenses</h1></div>

<section class="card">
  <h2 id="form-title">Add expense</h2>
  <form id="expense-form" class="form-grid">
    <input type="hidden" name="id">
    <label>Date <input type="date" name="date" required></label>
    <label>Category
      <select name="category" required>
        {% for c in categories %}<option>{{ c }}</option>{% endfor %}
      </select>
    </label>
    <label>Amount (₹) <input type="number" name="amount" min="0.01" step="0.01" required></label>
    <label>Payment method
      <select name="payment_method">
        {% for p in payment_methods %}<option>{{ p }}</option>{% endfor %}
      </select>
    </label>
    <label class="wide">Description <input name="description" maxlength="200"></label>
    <label class="check"><input type="checkbox" name="is_recurring"> Recurring</label>
    <div class="actions">
      <button type="submit" id="submit-btn">Add expense</button>
      <button type="button" id="cancel-edit" class="secondary" hidden>Cancel</button>
    </div>
  </form>
  <p id="form-message" class="message" hidden></p>
</section>

<section class="card">
  <div class="card-head">
    <h2>History</h2>
    <div class="filters">
      <label class="inline small">Month <input type="month" id="filter-month"></label>
      <label class="inline small">Category
        <select id="filter-category">
          <option value="">All</option>
          {% for c in categories %}<option>{{ c }}</option>{% endfor %}
        </select>
      </label>
    </div>
  </div>
  <p class="muted small" id="expense-summary"></p>
  <div class="table-wrap"><table id="expense-table">
    <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Payment</th><th class="num">Amount</th><th></th></tr></thead>
    <tbody></tbody>
  </table></div>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/expenses.js"></script>{% endblock %}
