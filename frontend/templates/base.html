<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/">Expense Tracker</a>
    <nav>
      <a href="/" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
      <a href="/expenses" class="{{ 'active' if active == 'expenses' }}">Expenses</a>
      <a href="/budgets" class="{{ 'active' if active == 'budgets' }}">Budgets</a>
    </nav>
    <div class="user">
      <span>{{ user.username }}</span>
      <button id="logout" class="link">Log out</button>
    </div>
  </header>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/api.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
